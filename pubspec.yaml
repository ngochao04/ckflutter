name: antique_manager
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase (chỉ Auth và Firestore)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  
  # Supabase Storage thay thế Firebase Storage
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Image
  image_picker: ^1.0.5
  cached_network_image: ^3.3.0
  
  # UI
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  path_provider: ^2.1.1
  cupertino_icons: ^1.0.8

  http: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^5.0.0
  

flutter:
  uses-material-design: true